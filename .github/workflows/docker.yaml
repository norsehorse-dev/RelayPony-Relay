name: Build image

on:
  push:
    branches:
      - tcely-main

jobs:
  docker-image:
    concurrency:
      cancel-in-progress: false
      group: ${{ github.repository }}-${{ github.workflow }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets:
      registry-auths: |
        - registry: 'ghcr.io'
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
    with:
      cache: true
      cache-mode: 'max'
      context: 'docker'
      meta-images: 'ghcr.io/${{ github.repository_owner }}/relaypony-relay'
      output: 'image'
      platforms: 'linux/amd64,linux/arm64'
      push: true
      setup-qemu: false
      meta-flavor: 'latest=false'
      meta-tags: |
        type=schedule,pattern=weekly
        type=raw,enable={{is_default_branch}},value=latest
        type=raw,enable={{is_not_default_branch}},value=test
        type=ref,event=tag
        type=ref,event=pr

